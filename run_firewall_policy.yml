---
# run_firewall_policy.yml
#
# AWX job template playbook for paloalto_policy_manager_ver2.py.
# Put this file, the script, requests.xlsx and vault_panos.yml in the same
# AWX project (Git repo).
#
# ---------------------------------------------------------------------------
# 1) Credentials: stored in vault_panos.yml, encrypted with ansible-vault.
#    The file must contain:
#      panos_username: <firewall username>
#      panos_password: <firewall password>
#
#    In AWX, create a credential of type "Vault" with the Vault password
#    and attach it to the job template.
#
# 2) Inventory: add the firewall as a host and set ansible_host to its
#    management IP.
#
# 3) Execution Environment must have: pan-os-python, openpyxl
#
# 4) Extra vars on the job template / survey:
#      pan_apply: false     # true = stage changes in candidate config
#      pan_commit: false    # true = also commit
# ---------------------------------------------------------------------------

- name: Push Palo Alto security policies from Excel
  hosts: all
  gather_facts: false
  connection: local
  serial: 1            # one firewall at a time - they all write to the same Excel file
  vars_files:
    - vault_panos.yml
  vars:
    pan_apply: false
    pan_commit: false
    pan_excel: "{{ playbook_dir }}/requests.xlsx"

  tasks:
    - name: Run policy manager against {{ inventory_hostname }}
      ansible.builtin.command:
        argv: "{{ base_args + (['--apply'] if pan_apply | bool else []) + (['--commit'] if pan_commit | bool else []) }}"
      vars:
        base_args:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/paloalto_policy_manager_ver2.py"
          - "--excel"
          - "{{ pan_excel }}"
          - "--implementation-sheet"
          - "Impl-{{ inventory_hostname[:25] }}"
      environment:
        PANOS_HOSTNAME: "{{ ansible_host | default(inventory_hostname) }}"
        PANOS_USERNAME: "{{ panos_username }}"
        PANOS_PASSWORD: "{{ panos_password }}"
      register: pan_run
      changed_when: >-
        (pan_apply | bool) and
        (pan_run.stdout is search('Summary: [1-9]\d* merged') or
         pan_run.stdout is search(', [1-9]\d* created'))

    - name: Show results for {{ inventory_hostname }}
      ansible.builtin.debug:
        var: pan_run.stdout_lines
